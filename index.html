<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>IronLog</title>
<meta name="theme-color" content="#0b0b0c" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="IronLog" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;600;700;800&display=swap');
:root{
  --bg:#0b0b0c; --surface:#161618; --surface2:#202024; --line:#2c2c31;
  --text:#f3f3ef; --muted:#86867f; --volt:#cdfa3e;
  --display:'Anton', Impact, sans-serif; --body:'Barlow', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:radial-gradient(120% 80% at 50% -10%, #18180c 0%, var(--bg) 55%) fixed;
  color:var(--text);font-family:var(--body);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior:none;
}
button{cursor:pointer;border:none;font-family:var(--body);color:inherit;background:none;}
input{font-family:var(--body);}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;}
.muted{color:var(--muted);}

.headRow{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
.brand{font-family:var(--display);font-size:34px;letter-spacing:1px;line-height:1;}
.brand b{color:var(--volt);font-weight:400;}
.weekTag{color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:1.5px;margin-top:4px;text-transform:uppercase;}
.iconBtn{background:var(--surface);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);font-size:20px;}

.pad{padding:26px 20px 44px;}
.progressWrap{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:22px;}
.progressTop{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.progressBig{font-family:var(--display);font-size:46px;color:var(--volt);line-height:.9;}
.progressBig span{color:var(--muted);font-size:26px;}
.progressLbl{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;line-height:1.25;}
.bar{display:flex;gap:5px;}
.bar i{flex:1;height:8px;border-radius:4px;background:var(--surface2);}
.bar i.on{background:var(--volt);}

.cards{display:flex;flex-direction:column;gap:12px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;transition:transform .12s ease;}
.card:active{transform:scale(.985);}
.card.done{border-color:var(--volt);}
.cardLeft{display:flex;align-items:center;gap:14px;min-width:0;}
.cardIndex{font-family:var(--display);font-size:22px;color:var(--muted);flex-shrink:0;}
.cardTitle{font-family:var(--display);font-size:24px;letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card.done .cardTitle{color:var(--volt);}
.cardSub{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:1px;}
.donePill{display:inline-flex;align-items:center;gap:5px;background:var(--volt);color:#0b0b0c;font-weight:800;font-size:12.5px;padding:7px 12px;border-radius:999px;letter-spacing:.5px;flex-shrink:0;}
.goPill{color:var(--volt);font-weight:800;font-size:13px;letter-spacing:1px;flex-shrink:0;}
.hint{color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:18px;font-weight:500;}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-weight:600;}

/* session */
.sessBar{display:flex;justify-content:space-between;align-items:center;padding:20px 16px 10px;gap:10px;}
.sessSplit{font-family:var(--display);font-size:20px;color:var(--volt);letter-spacing:.5px;text-align:center;}
.sessProg{color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;text-align:center;}
.finishBtn{background:var(--volt);color:#0b0b0c;font-weight:800;font-size:12.5px;padding:10px 14px;border-radius:11px;letter-spacing:.8px;flex-shrink:0;}
.finishBtn:disabled{opacity:.4;}
.chipRow{display:flex;gap:7px;padding:6px 16px 12px;overflow-x:auto;}
.chip{min-width:38px;height:34px;border-radius:9px;font-size:13px;flex-shrink:0;background:var(--surface2);color:var(--muted);font-weight:600;}
.chip.has{color:var(--volt);}
.chip.active{background:var(--volt);color:#0b0b0c;font-weight:800;}
.chip.done{background:var(--volt);color:#0b0b0c;font-weight:800;}
.sessBody{padding:4px 20px 30px;}
.exName{font-family:var(--display);font-size:33px;line-height:1.02;margin:6px 0 16px;letter-spacing:.3px;}
.lastBox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;}
.lbl{color:var(--muted);font-size:10.5px;font-weight:800;letter-spacing:1.8px;margin-bottom:8px;}
.lbl.volt{color:var(--volt);}
.sets{display:flex;flex-wrap:wrap;gap:7px;}
.setChip{background:var(--surface2);border-radius:8px;padding:5px 9px;font-size:14px;font-weight:700;}
.kg{font-size:10.5px;color:var(--muted);font-weight:700;margin-left:1px;}
.todayRow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin-bottom:6px;}
.setNum{width:22px;height:22px;border-radius:6px;background:var(--volt);color:#0b0b0c;display:grid;place-items:center;font-weight:800;font-size:12px;}
.setVal{font-size:16px;font-weight:700;flex:1;}
.delBtn{color:var(--muted);padding:6px;font-size:15px;}
.inputGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px;}
.stepBox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 14px;}
.stepBox.dim{opacity:.5;pointer-events:none;}
.stepCtrl{display:flex;align-items:center;justify-content:space-between;}
.stepBtn{background:var(--surface2);width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:20px;font-weight:700;}
.stepVal{font-family:var(--display);font-size:30px;line-height:1;}
.stepVal span{font-size:13px;color:var(--muted);font-family:var(--body);font-weight:700;margin-left:2px;}
.logBtn{width:100%;background:var(--volt);color:#0b0b0c;font-family:var(--display);font-size:22px;letter-spacing:1px;padding:16px;border-radius:15px;}
.logBtn.dim{background:var(--surface2);color:var(--muted);}
.navRow{display:flex;gap:10px;margin-top:12px;}
.navBtn{flex:1;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:13px;letter-spacing:1px;padding:12px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:4px;}
.navBtn:disabled{opacity:.35;}

/* set tracker */
.setTrack{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px 13px;margin-bottom:12px;}
.setTrackTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.setCount{font-family:var(--display);font-size:18px;color:var(--muted);letter-spacing:.5px;}
.setCount.hit{color:var(--volt);}
.pips{display:flex;gap:7px;flex-wrap:wrap;}
.pip{flex:1;min-width:26px;height:12px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);}
.pip.done{background:var(--volt);border-color:var(--volt);}
.pip.extra{background:transparent;border:1px dashed var(--volt);}

/* rest overlay */
.rest{position:absolute;inset:0;background:rgba(8,8,9,.95);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;}
.restPulse{position:absolute;width:220px;height:220px;border-radius:50%;background:var(--volt);animation:pulse 1.6s ease-out infinite;top:28%;}
@keyframes pulse{0%{transform:scale(.8);opacity:.5}70%{transform:scale(1.35);opacity:0}100%{opacity:0}}
.restLbl{color:var(--volt);font-weight:800;letter-spacing:3px;font-size:13px;z-index:1;}
.restTime{font-family:var(--display);font-size:88px;line-height:1;margin:6px 0 4px;z-index:1;font-variant-numeric:tabular-nums;}
.restSub{color:var(--muted);font-size:12.5px;font-weight:600;z-index:1;}
.restBtns{display:flex;gap:10px;margin-top:26px;z-index:1;}
.restAdj{background:var(--surface2);font-weight:800;font-size:13px;padding:12px 16px;border-radius:12px;}
.restSkip{background:var(--volt);color:#0b0b0c;font-family:var(--display);font-size:17px;letter-spacing:1px;padding:12px 30px;border-radius:12px;}

/* edit */
.saveBtn{background:var(--volt);color:#0b0b0c;font-weight:800;font-size:13px;padding:10px 16px;border-radius:11px;letter-spacing:.8px;}
.editCard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px;}
.editHead{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 8px 14px;gap:6px;}
.dayName{flex:1;min-width:0;background:transparent;border:none;border-bottom:1px solid transparent;color:var(--text);font-family:var(--display);font-size:20px;letter-spacing:.5px;padding:6px 2px;}
.dayName:focus{outline:none;border-bottom-color:var(--volt);}
.editToggle{color:var(--muted);font-weight:800;font-size:15px;padding:10px 12px;flex-shrink:0;}
.editBody{padding:4px 12px 14px;}
.editRow{display:flex;align-items:center;gap:10px;margin-bottom:7px;flex-wrap:wrap;}
.editIdx{color:var(--muted);font-weight:800;width:16px;font-size:13px;}
.editInput{flex:1;min-width:120px;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 11px;font-size:14.5px;font-weight:600;}
.setStep{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;}
.setStep button{width:28px;height:28px;border-radius:7px;background:var(--bg);font-size:17px;font-weight:800;display:grid;place-items:center;color:var(--text);}
.setStep span{min-width:16px;text-align:center;font-weight:800;font-size:14px;}
.setStep em{font-size:10px;color:var(--muted);font-style:normal;font-weight:700;letter-spacing:.5px;margin-right:3px;}
.addBtn{display:inline-flex;align-items:center;gap:5px;color:var(--volt);font-weight:800;font-size:13px;padding:8px 2px;}
.delDayBtn{width:100%;margin-top:8px;color:#ff7a7a;font-weight:700;font-size:12.5px;padding:9px;border:1px solid var(--line);border-radius:9px;background:transparent;}
.addDayBtn{width:100%;margin-top:12px;background:var(--surface);border:1px dashed var(--line);color:var(--volt);font-weight:800;font-size:14px;padding:14px;border-radius:14px;}
.dataRow{display:flex;gap:10px;margin-top:18px;}
.dataBtn{flex:1;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px;padding:12px;border-radius:12px;text-align:center;}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" accept="application/json" style="display:none" />

<script>
/* ---------------- constants ---------------- */
var DEFAULT_SETS = 3;
var DEFAULT_ORDER = ["Push","Pull","Legs","Torso","Limbs"];
var DEFAULT_CONFIG = {
  Push:["Bench Press","Overhead Press","Incline DB Press","Triceps Pushdown","Lateral Raise"],
  Pull:["Deadlift","Pull-Up","Barbell Row","Face Pull","Biceps Curl"],
  Legs:["Back Squat","Romanian Deadlift","Leg Press","Leg Curl","Calf Raise"],
  Torso:["Bench Press","Barbell Row","Overhead Press","Pull-Up","Plank"],
  Limbs:["Biceps Curl","Triceps Pushdown","Lateral Raise","Hammer Curl","Calf Raise"]
};

/* ---------------- persistence ---------------- */
function load(k,d){ try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;} }
function save(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
function genId(){ return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function normEx(e){ return typeof e==="string" ? {name:e,sets:DEFAULT_SETS} : {name:e.name,sets:e.sets||DEFAULT_SETS}; }

/* Convert any older saved shape into the current model:
   splits = [ {id, name, exercises:[{name,sets}]} ].
   Days keep a stable id (original name for old data) so history survives renames. */
function migrate(loaded){
  if(Array.isArray(loaded)){
    return loaded.map(function(s){
      return {id:s.id||genId(), name:s.name||"Day", exercises:(s.exercises||[]).map(normEx)};
    });
  }
  var src = (loaded && typeof loaded==="object") ? loaded : DEFAULT_CONFIG;
  var order = DEFAULT_ORDER.filter(function(k){return src[k];});
  Object.keys(src).forEach(function(k){ if(order.indexOf(k)<0) order.push(k); });
  if(!order.length) order = DEFAULT_ORDER.slice();
  return order.map(function(k){ return {id:k, name:k, exercises:(src[k]||[]).map(normEx)}; });
}

var S = {
  splits: migrate(load("ironlog_config_v1", DEFAULT_CONFIG)),
  history: load("ironlog_history_v1", {}),   // "splitId::exName" -> [{date, sets:[{w,r}]}]
  done: load("ironlog_done_v1", {}),          // "splitId" -> iso
  view: "home",
  session: null,        // {splitId, idx, logs:{exName:[{w,r}]}}
  restEnd: null,
  ui: { w:20, r:8 },
  editDraft: null,
  editOpen: null
};
var audioCtx = null;

function splitById(id){ for(var i=0;i<S.splits.length;i++) if(S.splits[i].id===id) return S.splits[i]; return null; }
function draftSplit(id){ for(var i=0;i<S.editDraft.length;i++) if(S.editDraft[i].id===id) return S.editDraft[i]; return null; }

/* ---------------- date helpers (week starts Monday) ---------------- */
function startOfWeek(){ var x=new Date();x.setHours(0,0,0,0);var d=(x.getDay()+6)%7;x.setDate(x.getDate()-d);return x; }
function isThisWeek(iso){ return iso ? new Date(iso) >= startOfWeek() : false; }
function weekLabel(){ return startOfWeek().toLocaleDateString(undefined,{day:"numeric",month:"short"}); }
function fmtTime(s){ var m=Math.floor(s/60); var sec=Math.max(0,s%60); return m+":"+String(sec).padStart(2,"0"); }
function remaining(){ return S.restEnd ? Math.ceil((S.restEnd-Date.now())/1000) : 0; }
function resting(){ return S.restEnd && remaining()>0; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

/* ---------------- audio + haptics ---------------- */
function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.18,0.36].forEach(function(t){
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sine"; o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001,audioCtx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.4,audioCtx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+t+0.15);
      o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+0.16);
    });
  }catch(e){}
}
function vibe(p){ if(navigator.vibrate) navigator.vibrate(p); }

/* ---------------- history lookup ---------------- */
function prevPerf(splitId,exName){ var a=S.history[splitId+"::"+exName]; return a&&a.length?a[a.length-1]:null; }

/* ---------------- HOME ---------------- */
function homeHTML(){
  var doneCount = S.splits.filter(function(s){return isThisWeek(S.done[s.id]);}).length;
  var bars = S.splits.map(function(s){return '<i class="'+(isThisWeek(S.done[s.id])?"on":"")+'"></i>';}).join("");
  var cards = S.splits.length ? S.splits.map(function(s,i){
    var fin = isThisWeek(S.done[s.id]);
    var right = fin ? '<span class="donePill">&#10003; DONE</span>' : '<span class="goPill">START &rsaquo;</span>';
    return '<button class="card'+(fin?" done":"")+'" data-action="start" data-id="'+s.id+'">'
      +'<span class="cardLeft"><span class="cardIndex">'+String(i+1).padStart(2,"0")+'</span>'
      +'<span style="min-width:0"><span class="cardTitle">'+esc(s.name)+'</span><span class="cardSub">'+s.exercises.length+' exercises</span></span></span>'
      +right+'</button>';
  }).join("") : '<div class="empty">No workout days yet.<br>Tap the gear to add one.</div>';
  return '<div class="pad">'
    +'<div class="headRow"><div><div class="brand">IRON<b>LOG</b></div>'
    +'<div class="weekTag">Week of '+weekLabel()+'</div></div>'
    +'<button class="iconBtn" data-action="edit" aria-label="Settings">&#9881;</button></div>'
    +'<div class="progressWrap"><div class="progressTop">'
    +'<span class="progressBig">'+doneCount+'<span>/'+S.splits.length+'</span></span>'
    +'<span class="progressLbl">sessions<br>this week</span></div>'
    +'<div class="bar">'+bars+'</div></div>'
    +'<div class="cards">'+cards+'</div>'
    +'<div class="hint">Tap a session to begin. Completed sessions turn lime until the week resets (Monday).</div>'
    +'</div>';
}

/* ---------------- SESSION ---------------- */
function sessionHTML(){
  var se=S.session, sp=splitById(se.splitId);
  if(!sp){ S.session=null; S.view="home"; return homeHTML(); }
  var exs=sp.exercises, ex=exs[se.idx], name=ex.name;
  var prev=prevPerf(se.splitId,name), today=se.logs[name]||[];
  var total=Object.keys(se.logs).reduce(function(a,k){return a+se.logs[k].length;},0);
  var chips=exs.map(function(e,i){
    var c=(se.logs[e.name]||[]).length;
    var cls="chip"+(i===se.idx?" active":(c>=e.sets?" done":(c?" has":"")));
    return '<button class="'+cls+'" data-action="jump" data-i="'+i+'">'+(i+1)+'</button>';
  }).join("");
  var lastHTML = prev
    ? '<div class="sets">'+prev.sets.map(function(s){return '<span class="setChip">'+s.w+'<span class="kg">kg</span> &times; '+s.r+'</span>';}).join("")+'</div>'
    : '<div class="muted" style="font-size:13.5px;font-weight:500">No history yet &mdash; set the baseline.</div>';
  var todayHTML = today.length
    ? '<div style="margin-bottom:14px"><div class="lbl volt">TODAY</div>'+today.map(function(s,i){
        return '<div class="todayRow"><span class="setNum">'+(i+1)+'</span>'
          +'<span class="setVal">'+s.w+'<span class="kg">kg</span> &times; '+s.r+'</span>'
          +'<button class="delBtn" data-action="removeset" data-i="'+i+'">&#128465;</button></div>';
      }).join("")+'</div>'
    : '';
  var dim = resting() ? " dim" : "";
  var overlay = resting() ? restHTML() : "";
  return '<div class="sessBar">'
    +'<button class="iconBtn" data-action="close" aria-label="Close">&times;</button>'
    +'<div style="min-width:0;flex:1"><div class="sessSplit">'+esc(sp.name)+'</div><div class="sessProg">Exercise '+(se.idx+1)+' / '+exs.length+'</div></div>'
    +'<button class="finishBtn" data-action="finish" '+(total?"":"disabled")+'>FINISH</button></div>'
    +'<div class="chipRow">'+chips+'</div>'
    +'<div class="sessBody">'
    +'<div class="exName">'+esc(name)+'</div>'
    +setTrackHTML(ex.sets, today.length)
    +'<div class="lastBox"><div class="lbl">LAST TIME</div>'+lastHTML+'</div>'
    +todayHTML
    +'<div class="inputGrid">'
    +'<div class="stepBox'+dim+'"><div class="lbl" style="text-align:center">WEIGHT</div><div class="stepCtrl">'
    +'<button class="stepBtn" data-action="stepw" data-step="-2.5">&minus;</button>'
    +'<div class="stepVal">'+S.ui.w+'<span>kg</span></div>'
    +'<button class="stepBtn" data-action="stepw" data-step="2.5">+</button></div></div>'
    +'<div class="stepBox'+dim+'"><div class="lbl" style="text-align:center">REPS</div><div class="stepCtrl">'
    +'<button class="stepBtn" data-action="stepr" data-step="-1">&minus;</button>'
    +'<div class="stepVal">'+S.ui.r+'</div>'
    +'<button class="stepBtn" data-action="stepr" data-step="1">+</button></div></div>'
    +'</div>'
    +'<button class="logBtn'+(resting()?" dim":"")+'" data-action="log" '+(resting()?"disabled":"")+'>'
    +(resting()?'RESTING &middot; '+fmtTime(remaining()):'LOG SET')+'</button>'
    +'<div class="navRow">'
    +'<button class="navBtn" data-action="nav" data-dir="-1" '+(se.idx===0?"disabled":"")+'>&lsaquo; PREV</button>'
    +'<button class="navBtn" data-action="nav" data-dir="1" '+(se.idx===exs.length-1?"disabled":"")+'>NEXT &rsaquo;</button>'
    +'</div></div>'
    +overlay;
}

function setTrackHTML(target, doneCount){
  var n=Math.max(target,doneCount), pips="";
  for(var k=0;k<n;k++){
    var cls = k<doneCount ? (k<target?"pip done":"pip extra") : "pip";
    pips+='<span class="'+cls+'"></span>';
  }
  var hit = doneCount>=target;
  return '<div class="setTrack"><div class="setTrackTop">'
    +'<span class="lbl" style="margin:0">SETS</span>'
    +'<span class="setCount'+(hit?" hit":"")+'">'+doneCount+' / '+target+(hit?' &#10003;':'')+'</span></div>'
    +'<div class="pips">'+pips+'</div></div>';
}

function restHTML(){
  return '<div class="rest"><div class="restPulse"></div>'
    +'<div class="restLbl">&#10074;&#10074; REST</div>'
    +'<div class="restTime" id="restTime">'+fmtTime(remaining())+'</div>'
    +'<div class="restSub">Logging locked until rest ends</div>'
    +'<div class="restBtns">'
    +'<button class="restAdj" data-action="adjrest" data-sec="-15">&minus;15s</button>'
    +'<button class="restSkip" data-action="skiprest">SKIP</button>'
    +'<button class="restAdj" data-action="adjrest" data-sec="15">+15s</button>'
    +'</div></div>';
}

/* ---------------- EDIT ---------------- */
function editHTML(){
  var cards=S.editDraft.map(function(s){
    var openB = S.editOpen===s.id, body="";
    if(openB){
      var rows=s.exercises.map(function(e,i){
        return '<div class="editRow"><span class="editIdx">'+(i+1)+'</span>'
          +'<input class="editInput" data-action="editinput" data-id="'+s.id+'" data-i="'+i+'" value="'+esc(e.name)+'" />'
          +'<div class="setStep">'
          +'<button data-action="editsets" data-id="'+s.id+'" data-i="'+i+'" data-d="-1">&minus;</button>'
          +'<span>'+e.sets+'</span>'
          +'<button data-action="editsets" data-id="'+s.id+'" data-i="'+i+'" data-d="1">+</button>'
          +'<em>sets</em></div>'
          +'<button class="delBtn" data-action="editdel" data-id="'+s.id+'" data-i="'+i+'">&#128465;</button></div>';
      }).join("");
      body='<div class="editBody">'+rows
        +'<button class="addBtn" data-action="editadd" data-id="'+s.id+'">+ Add exercise</button>'
        +'<button class="delDayBtn" data-action="editdelday" data-id="'+s.id+'">Delete this day</button>'
        +'</div>';
    }
    return '<div class="editCard"><div class="editHead">'
      +'<input class="dayName" data-action="editdayname" data-id="'+s.id+'" value="'+esc(s.name)+'" placeholder="Day name" />'
      +'<button class="editToggle" data-action="edittoggle" data-id="'+s.id+'">'+s.exercises.length+' &middot; '+(openB?"&minus;":"+")+'</button>'
      +'</div>'+body+'</div>';
  }).join("");
  return '<div class="pad">'
    +'<div class="headRow"><button class="iconBtn" data-action="home">&lsaquo;</button>'
    +'<div class="brand" style="font-size:26px">EDIT</div>'
    +'<button class="saveBtn" data-action="save">SAVE</button></div>'
    +'<div class="hint" style="margin:0 0 14px">Type over a day&#39;s title to rename it. Tap the count to expand and edit its exercises and set counts.</div>'
    +cards
    +'<button class="addDayBtn" data-action="editaddday">+ Add workout day</button>'
    +'<div class="dataRow"><button class="dataBtn" data-action="export">&#8681; Export backup</button>'
    +'<button class="dataBtn" data-action="import">&#8682; Import backup</button></div>'
    +'<div class="hint">Your data lives only on this device. Export a backup now and then so you never lose your numbers.</div>'
    +'</div>';
}

function render(){
  var html = S.view==="home" ? homeHTML() : S.view==="session" ? sessionHTML() : editHTML();
  document.getElementById("app").innerHTML = html;
}

/* ---------------- actions ---------------- */
function startSession(id){ if(!splitById(id))return; S.session={splitId:id,idx:0,logs:{}}; S.restEnd=null; prefill(); S.view="session"; render(); }
function prefill(){
  var se=S.session, sp=splitById(se.splitId); if(!sp) return;
  var name=sp.exercises[se.idx].name, today=se.logs[name]||[], prev=prevPerf(se.splitId,name);
  if(today.length){ S.ui={w:today[today.length-1].w,r:today[today.length-1].r}; }
  else if(prev&&prev.sets[0]){ S.ui={w:prev.sets[0].w,r:prev.sets[0].r}; }
  else { S.ui={w:20,r:8}; }
}
function logSet(){
  if(resting()) return;
  var se=S.session, sp=splitById(se.splitId); if(!sp) return;
  var name=sp.exercises[se.idx].name;
  if(!se.logs[name]) se.logs[name]=[];
  se.logs[name].push({w:S.ui.w,r:S.ui.r});
  if(audioCtx&&audioCtx.state==="suspended") audioCtx.resume();
  S.restEnd=Date.now()+REST_SECONDS*1000;
  vibe(30); render();
}
var REST_SECONDS = 180;
function finishSession(){
  var se=S.session, date=new Date().toISOString();
  Object.keys(se.logs).forEach(function(ex){
    if(!se.logs[ex].length) return;
    var key=se.splitId+"::"+ex, arr=(S.history[key]||[]).concat([{date:date,sets:se.logs[ex]}]);
    S.history[key]=arr.slice(-20);
  });
  save("ironlog_history_v1",S.history);
  S.done[se.splitId]=date; save("ironlog_done_v1",S.done);
  S.session=null; S.restEnd=null; S.view="home"; render();
}
function exportData(){
  var blob=new Blob([JSON.stringify({splits:S.splits,history:S.history,done:S.done})],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="ironlog-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
function importData(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      var cfg = d.splits || d.config;   // accept old and new backup shapes
      if(cfg){ S.splits=migrate(cfg); save("ironlog_config_v1",S.splits); }
      if(d.history){ S.history=d.history; save("ironlog_history_v1",S.history); }
      if(d.done){ S.done=d.done; save("ironlog_done_v1",S.done); }
      S.view="home"; render();
    }catch(e){ alert("Could not read that backup file."); }
  };
  r.readAsText(file);
}

/* ---------------- event delegation ---------------- */
document.getElementById("app").addEventListener("click", function(e){
  var el=e.target.closest("[data-action]"); if(!el) return;
  var a=el.getAttribute("data-action");
  if(a==="start") startSession(el.getAttribute("data-id"));
  else if(a==="edit"){ S.editDraft=JSON.parse(JSON.stringify(S.splits)); S.editOpen=S.splits.length?S.splits[0].id:null; S.view="edit"; render(); }
  else if(a==="home"){ S.view="home"; render(); }
  else if(a==="close"){ S.view="home"; S.restEnd=null; render(); }
  else if(a==="log") logSet();
  else if(a==="finish") finishSession();
  else if(a==="removeset"){ var i=+el.getAttribute("data-i"); var sp=splitById(S.session.splitId); var nm=sp.exercises[S.session.idx].name; S.session.logs[nm].splice(i,1); render(); }
  else if(a==="nav"){ var dd=+el.getAttribute("data-dir"); var mx=splitById(S.session.splitId).exercises.length-1; S.session.idx=Math.min(mx,Math.max(0,S.session.idx+dd)); prefill(); render(); }
  else if(a==="jump"){ S.session.idx=+el.getAttribute("data-i"); prefill(); render(); }
  else if(a==="stepw"){ S.ui.w=Math.max(0,Math.round((S.ui.w+(+el.getAttribute("data-step")))*100)/100); render(); }
  else if(a==="stepr"){ S.ui.r=Math.max(1,S.ui.r+(+el.getAttribute("data-step"))); render(); }
  else if(a==="skiprest"){ S.restEnd=null; render(); }
  else if(a==="adjrest"){ S.restEnd=(S.restEnd||Date.now())+(+el.getAttribute("data-sec"))*1000; render(); }
  else if(a==="edittoggle"){ var id=el.getAttribute("data-id"); S.editOpen=S.editOpen===id?null:id; render(); }
  else if(a==="editdel"){ draftSplit(el.getAttribute("data-id")).exercises.splice(+el.getAttribute("data-i"),1); render(); }
  else if(a==="editadd"){ draftSplit(el.getAttribute("data-id")).exercises.push({name:"New exercise",sets:DEFAULT_SETS}); render(); }
  else if(a==="editsets"){ var ob=draftSplit(el.getAttribute("data-id")).exercises[+el.getAttribute("data-i")]; ob.sets=Math.min(10,Math.max(1,ob.sets+(+el.getAttribute("data-d")))); render(); }
  else if(a==="editaddday"){ var nd={id:genId(),name:"New Day",exercises:[{name:"New exercise",sets:DEFAULT_SETS}]}; S.editDraft.push(nd); S.editOpen=nd.id; render(); }
  else if(a==="editdelday"){ if(confirm("Delete this day and its saved history?")){ var did=el.getAttribute("data-id"); S.editDraft=S.editDraft.filter(function(s){return s.id!==did;}); if(S.editOpen===did) S.editOpen=null; render(); } }
  else if(a==="save"){
    S.splits=S.editDraft.map(function(s){ return {id:s.id, name:(s.name||"Day").trim()||"Day", exercises:s.exercises.map(normEx)}; });
    save("ironlog_config_v1",S.splits);
    var ids={}; S.splits.forEach(function(s){ids[s.id]=1;});
    Object.keys(S.done).forEach(function(k){ if(!ids[k]) delete S.done[k]; });
    Object.keys(S.history).forEach(function(k){ if(!ids[k.split("::")[0]]) delete S.history[k]; });
    save("ironlog_done_v1",S.done); save("ironlog_history_v1",S.history);
    S.editDraft=null; S.view="home"; render();
  }
  else if(a==="export") exportData();
  else if(a==="import") document.getElementById("importFile").click();
});
document.getElementById("app").addEventListener("input", function(e){
  var el=e.target.closest("[data-action]"); if(!el) return;
  var a=el.getAttribute("data-action");
  if(a==="editinput"){ draftSplit(el.getAttribute("data-id")).exercises[+el.getAttribute("data-i")].name=el.value; }
  else if(a==="editdayname"){ draftSplit(el.getAttribute("data-id")).name=el.value; }
});
document.getElementById("importFile").addEventListener("change", function(e){
  if(e.target.files[0]) importData(e.target.files[0]); e.target.value="";
});

/* ---------------- rest timer tick ---------------- */
setInterval(function(){
  if(!S.restEnd) return;
  var rem=remaining();
  if(rem<=0){ beep(); vibe([200,80,200]); S.restEnd=null; render(); return; }
  var t=document.getElementById("restTime"); if(t) t.textContent=fmtTime(rem);
  var b=document.querySelector(".logBtn"); if(b&&S.view==="session") b.textContent="RESTING \u00B7 "+fmtTime(rem);
}, 250);

/* ---------------- service worker (offline) ---------------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}

render();
</script>
</body>
</html>
